<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070707">
<meta name="description" content="کارت ویزیت دیجیتال حامد محمدی نیکچه">
<title>حامد محمدی نیکچه — HMN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');
:root{--bg:#070707;--panel:#101010;--panel2:#141414;--orange:#ff6a00;--orange2:#ff9a45;--text:#f7f7f7;--muted:#929292;--line:rgba(255,106,0,.2)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{min-height:100vh;background:#070707;color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.045;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;opacity:.16}.o1{width:360px;height:360px;background:#ff6a00;top:-170px;right:-100px}.o2{width:280px;height:280px;background:#ff6a00;bottom:-150px;left:-90px}
.wrap{width:min(1120px,calc(100% - 30px));margin:30px auto 0;position:relative;z-index:1}
.nav{height:76px;border:1px solid rgba(255,255,255,.07);background:rgba(12,12,12,.7);backdrop-filter:blur(18px);border-radius:22px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px 10px 20px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px;height:48px;border-radius:14px}.brand b{font:900 19px Arial,sans-serif;letter-spacing:-1px}.brand span{display:block;color:#666;font:10px Arial,sans-serif;letter-spacing:1.5px;margin-top:2px}
.nav a{color:#bbb;text-decoration:none;font-size:12px;padding:10px 14px;border:1px solid rgba(255,255,255,.08);border-radius:12px;transition:.2s}.nav a:hover{color:#fff;border-color:rgba(255,106,0,.4)}
.card{display:grid;grid-template-columns:1.03fr .97fr;min-height:650px;border:1px solid var(--line);border-radius:34px;overflow:hidden;background:linear-gradient(145deg,rgba(22,22,22,.92),rgba(9,9,9,.92));box-shadow:0 35px 110px rgba(0,0,0,.72),0 0 80px rgba(255,106,0,.07)}
.visual{position:relative;display:flex;align-items:center;justify-content:center;min-height:650px;padding:45px;background:radial-gradient(circle at 50% 50%,rgba(255,106,0,.11),transparent 43%),#090909;border-left:1px solid rgba(255,106,0,.11)}
.ring{position:absolute;width:475px;height:475px;border-radius:50%;border:1px solid rgba(255,106,0,.25);box-shadow:0 0 0 20px rgba(255,106,0,.025),0 0 0 48px rgba(255,106,0,.012),0 0 100px rgba(255,106,0,.08)}
.ring:before,.ring:after{content:"";position:absolute;border:1px solid rgba(255,106,0,.12);border-radius:50%}.ring:before{inset:28px}.ring:after{inset:75px}
.profile{width:365px;height:365px;object-fit:cover;border-radius:50%;position:relative;z-index:2;border:9px solid #090909;outline:1px solid rgba(255,106,0,.65);filter:grayscale(100%) contrast(1.08);box-shadow:0 0 0 12px rgba(255,106,0,.055),0 35px 90px #000}
.logo-box{position:absolute;z-index:5;top:28px;left:28px;width:108px;height:108px;padding:9px;border-radius:27px;background:#0a0a0a;border:1px solid rgba(255,106,0,.45);box-shadow:0 18px 48px #000}.logo-box img{width:100%;height:100%;border-radius:20px}
.visual-tag{position:absolute;right:35px;bottom:29px;color:#5b5b5b;font:10px Arial,sans-serif;letter-spacing:2px;direction:ltr}
.info{padding:68px clamp(30px,6vw,78px);display:flex;flex-direction:column;justify-content:center}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--orange2);font:700 11px Arial,sans-serif;letter-spacing:2px;direction:ltr;margin-bottom:21px}.eyebrow:before{content:"";width:34px;height:2px;background:var(--orange);box-shadow:0 0 14px var(--orange)}
h1{font-size:clamp(38px,5.3vw,65px);line-height:1.18;letter-spacing:-2px;font-weight:900;margin-bottom:13px}h1 em{font-style:normal;color:var(--orange)}
.subtitle{font-size:16px;line-height:2;color:#929292;margin-bottom:34px}
.contacts{display:grid;gap:10px}.contact{display:flex;align-items:center;gap:14px;padding:12px 13px;text-decoration:none;color:#eee;border:1px solid rgba(255,255,255,.065);background:rgba(255,255,255,.025);border-radius:16px;transition:.23s}.contact:hover{transform:translateX(-6px);border-color:rgba(255,106,0,.48);background:rgba(255,106,0,.065)}
.icon{width:45px;height:45px;flex:0 0 45px;display:grid;place-items:center;border-radius:13px;color:var(--orange);font:700 13px Arial,sans-serif;background:rgba(255,106,0,.1);border:1px solid rgba(255,106,0,.15);direction:ltr}
.contact small{display:block;color:#606060;font:10px Arial,sans-serif;letter-spacing:1.2px;direction:ltr;margin-bottom:4px}.contact strong{display:block;font-size:12.5px;direction:ltr;unicode-bidi:plaintext}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:13px;text-decoration:none;font-size:12.5px;font-weight:800;transition:.2s}.primary{background:linear-gradient(135deg,#ff6100,#ff963e);color:#080808;box-shadow:0 12px 32px rgba(255,106,0,.18)}.secondary{color:#eee;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.03)}.btn:hover{transform:translateY(-3px)}
.bottom{display:flex;justify-content:space-between;align-items:center;color:#505050;font:10px Arial,sans-serif;direction:ltr;padding:15px 8px 25px}.bottom b{color:var(--orange)}
@media(max-width:820px){.wrap{margin-top:14px}.nav{height:68px}.nav a{display:none}.card{grid-template-columns:1fr}.visual{min-height:440px;border-left:0;border-bottom:1px solid rgba(255,106,0,.11)}.ring{width:335px;height:335px}.profile{width:285px;height:285px}.logo-box{width:78px;height:78px;top:18px;left:18px;border-radius:20px;padding:6px}.logo-box img{border-radius:14px}.info{padding:42px 24px 48px}h1{font-size:38px}.bottom{padding-bottom:10px}}
@media(max-width:390px){.visual{min-height:375px}.ring{width:280px;height:280px}.profile{width:235px;height:235px}.info{padding-inline:19px}h1{font-size:32px}.contact strong{font-size:10.5px}}
</style>
</head>
<body>

  <div class="contacts">

  <div class="actions">
    <a class="btn primary" href="mailto:hamedmohammadinikche@gmail.com">ارسال ایمیل</a>

    <a class="btn secondary" href="tel:+989355018071">تماس</a>
  </div>
</section>
</main>

<div class="bottom"><span>© HMN</span><span>DESIGNED with ❤️</span></div>
</div>
</body>
</html>
